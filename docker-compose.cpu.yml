# docker-compose.cpu.yml
# CPU-only deployment configuration for systems without GPU support

services:
  wsla-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsla-document-parser-cpu
    ports:
      - "8000:8000"
    volumes:
      - wsla_uploads:/app/wsla_uploads
      - wsla_output:/app/wsla_output
    environment:
      - WSLA_UPLOAD_DIR=/app/wsla_uploads
      - WSLA_OUTPUT_DIR=/app/wsla_output
      - WSLA_DEVICE=cpu
      - DOCLING_ARTIFACTS_PATH=/opt/docling/models
      - OMP_NUM_THREADS=4
    restart: unless-stopped

volumes:
  wsla_uploads:
  wsla_output:
