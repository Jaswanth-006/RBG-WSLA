services:
  wsla-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsla-document-parser
    ports:
      - "${PORT}:${PORT}"
    volumes:
      # Persist uploads and output across container restarts
      - wsla_uploads:/app/wsla_uploads
      - wsla_output:/app/wsla_output
    environment:
      - PORT=${PORT}
      - WSLA_UPLOAD_DIR=/app/wsla_uploads
      - WSLA_OUTPUT_DIR=/app/wsla_output
      - OMP_NUM_THREADS=4
      # auto = GPU when visible, else CPU. Set to cpu to force CPU.
      - WSLA_DEVICE=auto
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # Hand the container every NVIDIA GPU the host exposes.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  wsla_uploads:
  wsla_output:
